syntax = "proto3";

package chv.node.nwd.v1;

message Meta {
  string operation_id = 1;
  int64 request_unix_ms = 2;
}

message Result {
  string status = 1;
  string error_code = 2;
  string human_summary = 3;
}

message TopologySpec {
  string network_id = 1;
  string tenant_id = 2;
  string bridge_name = 3;
  string namespace_name = 4;
  string subnet_cidr = 5;
  string gateway_ip = 6;
  map<string, string> options = 7;
  uint32 vni = 8;                           // 0 = no overlay (bridge-only)
  repeated VtepEndpoint vtep_endpoints = 9; // peer VTEPs for this network
  OverlayType overlay_type = 10;
}

message NicSpec {
  string nic_id = 1;
  string vm_id = 2;
  string network_id = 3;
  string mac_address = 4;
  string tap_name = 5;
  string ip_address = 6;
}

message FirewallPolicy {
  string policy_version = 1;
  bytes policy_json = 2;
}

message NatPolicy {
  string policy_version = 1;
  bytes policy_json = 2;
}

message DhcpScope {
  string network_id = 1;
  string cidr = 2;
  string range_start = 3;
  string range_end = 4;
  repeated string dns_servers = 5;
}

message DnsScope {
  string network_id = 1;
  repeated string forwarders = 2;
  map<string, string> static_records = 3;
}

message ExposureSpec {
  string network_id = 1;
  string exposure_id = 2;
  string protocol = 3;
  uint32 external_port = 4;
  string target_ip = 5;
  uint32 target_port = 6;
  string mode = 7;
}

message EnsureNetworkTopologyRequest {
  Meta meta = 1;
  TopologySpec topology = 2;
}

message DeleteNetworkTopologyRequest {
  Meta meta = 1;
  string network_id = 2;
}

message AttachVmNicRequest {
  Meta meta = 1;
  NicSpec nic = 2;
}

message AttachVmNicResponse {
  Result result = 1;
  string namespace_handle = 2;
  string tap_handle = 3;
}

message DetachVmNicRequest {
  Meta meta = 1;
  string vm_id = 2;
  string nic_id = 3;
}

message SetFirewallPolicyRequest {
  Meta meta = 1;
  string network_id = 2;
  FirewallPolicy policy = 3;
}

message SetNatPolicyRequest {
  Meta meta = 1;
  string network_id = 2;
  NatPolicy policy = 3;
}

message EnsureDhcpScopeRequest {
  Meta meta = 1;
  DhcpScope scope = 2;
}

message EnsureDnsScopeRequest {
  Meta meta = 1;
  DnsScope scope = 2;
}

message ExposeServiceRequest {
  Meta meta = 1;
  ExposureSpec exposure = 2;
}

message WithdrawServiceExposureRequest {
  Meta meta = 1;
  string exposure_id = 2;
  string network_id = 3;
}

message NetworkHealthRequest {
  string network_id = 1;
}

message NetworkHealthResponse {
  Result result = 1;
  string network_id = 2;
  string health_status = 3;
  string last_error = 4;
}

message NamespaceState {
  string network_id = 1;
  string namespace_name = 2;
  string bridge_name = 3;
  string runtime_status = 4;
}

message ListNamespaceStateRequest {}

message ListNamespaceStateResponse {
  repeated NamespaceState items = 1;
}

service NetworkService {
  rpc EnsureNetworkTopology(EnsureNetworkTopologyRequest) returns (Result);
  rpc DeleteNetworkTopology(DeleteNetworkTopologyRequest) returns (Result);
  rpc AttachVmNic(AttachVmNicRequest) returns (AttachVmNicResponse);
  rpc DetachVmNic(DetachVmNicRequest) returns (Result);
  rpc SetFirewallPolicy(SetFirewallPolicyRequest) returns (Result);
  rpc SetNatPolicy(SetNatPolicyRequest) returns (Result);
  rpc EnsureDhcpScope(EnsureDhcpScopeRequest) returns (Result);
  rpc EnsureDnsScope(EnsureDnsScopeRequest) returns (Result);
  rpc ExposeService(ExposeServiceRequest) returns (Result);
  rpc WithdrawServiceExposure(WithdrawServiceExposureRequest) returns (Result);
  rpc GetNetworkHealth(NetworkHealthRequest) returns (NetworkHealthResponse);
  rpc ListNamespaceState(ListNamespaceStateRequest) returns (ListNamespaceStateResponse);
  rpc UpdateOverlay(UpdateOverlayRequest) returns (UpdateOverlayResponse);
  rpc UpdateSecurityPolicy(SecurityPolicy) returns (UpdateSecurityPolicyResponse);
  rpc UpdateRateLimit(RateLimitPolicy) returns (UpdateRateLimitResponse);
  rpc GetOverlayStatus(GetOverlayStatusRequest) returns (OverlayStatus);
}

// ---------------------------------------------------------------------------
// VXLAN overlay support
// ---------------------------------------------------------------------------

enum OverlayType {
  OVERLAY_NONE = 0;   // bridge-only (single node)
  OVERLAY_VXLAN = 1;  // kernel VXLAN
}

message VtepEndpoint {
  string node_id = 1;
  string vtep_ip = 2;
  uint32 vtep_port = 3; // default 4789
}

// ---------------------------------------------------------------------------
// Security policy
// ---------------------------------------------------------------------------

enum Direction {
  DIRECTION_BOTH = 0;
  DIRECTION_INGRESS = 1;
  DIRECTION_EGRESS = 2;
}

enum Protocol {
  PROTOCOL_ANY = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
  PROTOCOL_ICMP = 3;
}

enum PolicyAction {
  POLICY_DENY = 0;
  POLICY_ALLOW = 1;
}

message PortRange {
  uint32 min = 1; // 0 = any
  uint32 max = 2; // 0 = same as min (single port)
}

message SecurityRule {
  Direction direction = 1;
  Protocol protocol = 2;
  string src_cidr = 3;
  string dst_cidr = 4;
  PortRange src_port = 5;
  PortRange dst_port = 6;
  PolicyAction action = 7;
  uint32 priority = 8;
}

message SecurityPolicy {
  string vm_id = 1;
  string network_id = 2;
  PolicyAction default_action = 3;
  repeated SecurityRule rules = 4;
}

message RateLimitPolicy {
  string vm_id = 1;
  uint64 rate_bps = 2;    // bytes per second
  uint64 burst_bytes = 3; // max burst
}

// ---------------------------------------------------------------------------
// Overlay management messages
// ---------------------------------------------------------------------------

message FdbEntry {
  string mac_address = 1;
  string vtep_ip = 2;
}

message UpdateOverlayRequest {
  string network_id = 1;
  uint32 vni = 2;
  repeated VtepEndpoint vtep_endpoints = 3;
  repeated FdbEntry fdb_entries = 4;
}

message UpdateOverlayResponse {
  Result result = 1;
}

message UpdateSecurityPolicyResponse {
  Result result = 1;
}

message UpdateRateLimitResponse {
  Result result = 1;
}

message GetOverlayStatusRequest {
  string network_id = 1;
}

message OverlayStatus {
  string network_id = 1;
  uint32 vni = 2;
  bool vxlan_interface_up = 3;
  uint32 fdb_entry_count = 4;
  uint32 ebpf_programs_loaded = 5;
}
