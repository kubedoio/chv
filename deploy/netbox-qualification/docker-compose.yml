# Real-NetBox qualification lane (ADR-024 decision 4, lane 3 — issue
# kubedoio/chv#586, PR 5).
#
# A disposable, pinned NetBox the qualification suite
# (scripts/netbox-qualify.sh) runs the composed projection scenarios
# against. This is NOT a deployment artifact: every secret below is a
# fixed throwaway value, the API port binds to loopback only, and the
# harness tears the whole project down (`docker compose down -v`)
# when it exits. Never point production tooling at this instance.
#
# Authored against the canonical netbox-docker reference (release
# branch, fetched 2026-10-09): the service set, image pin, health
# checks, valkey commands, and the entrypoint/superuser contract come
# from netbox-docker's docker-compose.yml, Dockerfile, and
# docker/docker-entrypoint.sh at tag v4.7-5.1.1 (NetBox 4.7.x). The
# image ships its own env-var-driven /etc/netbox/config, so — unlike
# the reference compose — no ./configuration mount is needed.
#
# The `qualification-init` one-shot service waits for NetBox to be
# healthy (migrations applied, superuser created by the netbox
# service), then creates the fixed v1 API token, provisions the
# prerequisite objects (site, manufacturer + device type, device
# role, tags) and the `chv_` custom fields, and publishes the
# qualification environment (URL + token) to the shared
# `qualification-env` volume,
# which the host-side script reads with:
#
#   docker compose exec -T netbox cat /run/qualification/netbox.env

name: chv-netbox-qualification

services:
  netbox:
    image: docker.io/netboxcommunity/netbox:v4.7-5.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      # NetBox core (the shipped configuration.py reads all of these).
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: chv-qualification-db
      REDIS_HOST: redis
      REDIS_PASSWORD: chv-qualification-redis
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: chv-qualification-redis
      SECRET_KEY: chv-qualification-secret-key-0123456789abcdef0123456789abcdef
      # The entrypoint creates this superuser before NetBox starts;
      # qualification-init then mints the API token for it. Throwaway
      # credentials — the instance never leaves this host.
      SUPERUSER_NAME: chv-qualification
      SUPERUSER_EMAIL: chv-qualification@example.invalid
      SUPERUSER_PASSWORD: chv-qualification-password
    user: "netbox:root"
    ports:
      # Loopback only: disposable qualification state, never a
      # deployed service. The port is fixed so the published
      # NETBOX_QUALIFICATION_URL is stable.
      - "127.0.0.1:18780:8080"
    healthcheck:
      # The image's own health probe (curl /login/ on GRANIAN_PORT).
      # Patient on purpose: NetBox's first boot runs its migrations
      # before the app serves, and on a cold CI runner that outlasts
      # a tight budget — the first qualification dispatch (2026-10-09)
      # exhausted 90s + 5×15s at 151s and `up -d` aborted on the
      # unhealthy dependency. start_period 300s + 20×15s keeps the
      # wait inside the script's 900s boot timeout while tolerating a
      # slow cold boot.
      test: /opt/netbox/health.sh
      start_period: 300s
      timeout: 3s
      interval: 15s
      retries: 20
    volumes:
      # Where qualification-init publishes netbox.env for the host
      # script (read-only here; only the init service writes it).
      - qualification-env:/run/qualification:ro

  # One-shot: mint the fixed v1 API token, provision the prerequisite
  # objects and the `chv_` custom fields, and publish the
  # qualification environment. Runs the image's own entrypoint first
  # (DB wait + migrate --check, both no-ops once netbox is healthy),
  # then the provisioning shell. `down -v` between runs makes it all
  # idempotent anyway; the ORM get_or_create / delete+create calls are
  # belt-and-braces for a reused volume.
  qualification-init:
    image: docker.io/netboxcommunity/netbox:v4.7-5.1.1
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: chv-qualification-db
      REDIS_HOST: redis
      REDIS_PASSWORD: chv-qualification-redis
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: chv-qualification-redis
      SECRET_KEY: chv-qualification-secret-key-0123456789abcdef0123456789abcdef
      # The netbox service owns superuser creation; the init only
      # mints the token for the user that already exists.
      SKIP_SUPERUSER: "true"
    user: "netbox:root"
    command:
      - /opt/netbox/docker-entrypoint.sh
      - /bin/sh
      - -c
      - |
        set -e
        # A v1 token (40-char plaintext, `Authorization: Token` prefix)
        # because that is what the chv-netbox-adapter client sends.
        # NetBox's SUPERUSER_API_TOKEN path creates v2 (Bearer) tokens
        # instead, so the token is minted through the ORM directly.
        ./manage.py shell --no-startup --no-imports --interface python <<'PY'
        from django.contrib.auth import get_user_model
        from users.models import Token

        User = get_user_model()
        user = User.objects.get(username="chv-qualification")
        Token.objects.filter(user=user, version=1).delete()
        Token.objects.create(
            user=user,
            token="chvqualificationtoken0000000000000000000",
            version=1,
            write_enabled=True,
            description="chv real-NetBox qualification lane",
        )
        print("qualification token created")
        PY
        # Provision the prerequisite objects a plain (no --record)
        # qualification run needs: the `dc1` site, the `chv`
        # manufacturer + `chv-host` device type, the `chv-node` device
        # role (both `device_type` and `role` are required on device
        # creates by NetBox 4.7's `DeviceSerializer` — `role` has no
        # `required=False` and the model FK is non-nullable), and the
        # tags the adapter derives from the fixture architecture's
        # metadata (`chv-team` from the `team` label,
        # `chv-env-production` from the environment). Without these
        # the suite's device and tag writes 400 for a second,
        # undocumented reason — the prerequisites must exist before
        # the first scenario runs, not only when the recorder's
        # provision() happens to run.
        # DUPLICATION NOTE: the fixture recorder's `provision()`
        # (crates/chv-netbox-sim/tests/record_fixtures.rs) creates the
        # same objects over the REST API because it must work against
        # any NetBox instance, not just this compose stack — keep the
        # two sides in sync.
        ./manage.py shell --no-startup --no-imports --interface python <<'PY'
        from dcim.models import DeviceRole, DeviceType, Manufacturer, Site
        from extras.models import Tag

        site, _ = Site.objects.get_or_create(
            slug="dc1",
            defaults={"name": "dc1", "status": "active"},
        )
        print(f"site {site.slug} ready")
        manufacturer, _ = Manufacturer.objects.get_or_create(
            slug="chv",
            defaults={"name": "chv"},
        )
        device_type, _ = DeviceType.objects.get_or_create(
            manufacturer=manufacturer,
            slug="chv-host",
            defaults={"model": "chv-host"},
        )
        print(f"device type {device_type.slug} ready")
        # DeviceRole is a NestedLtreeGroupModel; get_or_create at the
        # root of the slug tree is all the adapter's {"slug":
        # "chv-node"} write reference resolves to.
        role, _ = DeviceRole.objects.get_or_create(
            slug="chv-node",
            defaults={"name": "chv-node"},
        )
        print(f"device role {role.slug} ready")
        for slug in ("chv-team", "chv-env-production"):
            Tag.objects.get_or_create(slug=slug, defaults={"name": slug})
            print(f"tag {slug} ready")
        PY
        # Provision the `chv_` custom fields (type text, on the six
        # content types the projection writes) — the same fields the
        # recorder's provision() creates over the REST API. This is
        # required, not cosmetic: real NetBox rejects any create or
        # update whose `custom_fields` dict carries names that do not
        # exist for the object type (v4.7
        # CustomFieldsDataField.to_internal_value: "Reject any unknown
        # custom field names" -> 400), and every adapter write carries
        # the chv_ ownership markers (plus `chv_owner` whenever
        # metadata.owner is set, and the device facts
        # `chv_cpu_cores` / `chv_memory_gb` / `chv_datastores`). The
        # suite's instance reset clears objects, never field
        # definitions, so these survive between scenarios.
        #
        # SYNC NOTE — the names below are hardcoded because YAML
        # cannot import Rust. The source of truth is
        # `CustomFieldNames::ownership_fields` +
        # `CustomFieldNames::enrichment_fields` in
        # crates/chv-netbox-adapter/src/ownership.rs (pinned by that
        # crate's
        # `ownership_plus_enrichment_enumerates_the_full_provisioning_surface`
        # test); when a field is added there, add it here in the same
        # PR. All fields are NetBox `text` fields — the adapter only
        # ever writes string values (numbers as their decimal strings,
        # datastore facts as a comma-joined `name:kind` list).
        # ORM note: in NetBox 4.x the CustomField→ContentType M2M is
        # `object_types` (renamed from 3.x `content_types`); the REST
        # serializer field carries the same name.
        ./manage.py shell --no-startup --no-imports --interface python <<'PY'
        from django.contrib.contenttypes.models import ContentType
        from extras.models import CustomField

        object_types = [
            ContentType.objects.get(app_label=app_label, model=model)
            for app_label, model in (
                ("dcim", "device"),
                ("virtualization", "virtualmachine"),
                ("virtualization", "vminterface"),
                ("ipam", "prefix"),
                ("ipam", "vlan"),
                ("ipam", "ipaddress"),
            )
        ]
        for name in (
            "chv_external_id",
            "chv_architecture_id",
            "chv_architecture_version",
            "chv_managed_by",
            "chv_managed_state",
            "chv_mapping_version",
            "chv_owner",
            "chv_cpu_cores",
            "chv_memory_gb",
            "chv_datastores",
        ):
            field, _ = CustomField.objects.get_or_create(
                name=name,
                defaults={"type": "text", "label": name},
            )
            field.object_types.set(object_types)
            print(f"custom field {name} ready")
        PY
        mkdir -p /run/qualification
        cat > /run/qualification/netbox.env <<'ENV'
        NETBOX_QUALIFICATION_URL=http://127.0.0.1:18780
        NETBOX_QUALIFICATION_TOKEN=chvqualificationtoken0000000000000000000
        ENV
        echo "qualification environment published to /run/qualification/netbox.env"
    volumes:
      - qualification-env:/run/qualification:rw

  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: chv-qualification-db
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - netbox-postgres:/var/lib/postgresql

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
      - sh
      - -c
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: chv-qualification-redis
    healthcheck:
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
      - netbox-redis-data:/data

  redis-cache:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
      - sh
      - -c
      - valkey-server --requirepass $$REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: chv-qualification-redis
    healthcheck:
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
      - netbox-redis-cache-data:/data

volumes:
  netbox-postgres:
  netbox-redis-data:
  netbox-redis-cache-data:
  qualification-env:
