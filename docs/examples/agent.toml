# CHV Node Agent Configuration
# Place this file at /etc/chv/agent.toml

socket_path = "/run/chv/agent/api.sock"
runtime_dir = "/var/lib/chv/agent"
log_level = "info"
control_plane_addr = "https://127.0.0.1:8443"
stord_socket = "/run/chv/stord/api.sock"
nwd_socket = "/run/chv/nwd/api.sock"
chv_binary_path = "/usr/bin/cloud-hypervisor"
stord_binary_path = "/usr/bin/chv-stord"
nwd_binary_path = "/usr/bin/chv-nwd"
cache_path = "/var/lib/chv/cache/agent-cache.json"
# Single durable lifecycle authority (prompt-02 cutover): core-managed runs
# CellHV Core as the sole authority on this node — the qualified default.
# "legacy" keeps the agent's own provider-mutation surface and is a
# compatibility adapter only (explicit opt-in; the agent logs a warning).
authority_mode = "core-managed"
core_store_path = "/var/lib/chv/agent/core.db"
core_api_socket_path = "/run/chv/core/core-v1.sock"
core_archive_path = "/var/lib/chv/agent/node-cache-v1.archive"
node_id = ""                  # assigned automatically during enrollment
metrics_bind = "127.0.0.1:9901"
storage_base_dir = "/var/lib/chv/storage"  # agent probes subdirs for storage classes

# One-time bootstrap token for initial enrollment
bootstrap_token_path = "/etc/chv/bootstrap.token"

# Steady-state TLS paths (populated by the agent after enrollment)
tls_cert_path = "/run/chv/agent/agent.crt"
tls_key_path = "/run/chv/agent/agent.key"
ca_cert_path = "/etc/chv/certs/ca.crt"

# JWT secret — MUST match controlplane.toml jwt_secret for console access
jwt_secret = "<same-as-controlplane>"

# Stord path confinement preserved across supervisor respawns (#376).
# Empty/omitted = the respawned daemon runs allow-all (historical
# behavior); deployments relying on stord's path_allowlist mirror it
# here so a respawned stord keeps the operator's posture. Must cover
# the volume locator dir (storage_base_dir and the dirs the agent
# passes as volume locators) and any image/seed dirs.
stord_path_allowlist = ["/var/lib/chv/storage", "/var/lib/chv/agent"]

# Stord respawn config fidelity (#385). Point this at the operator's
# stord.toml and a supervisor respawn execs chv-stord with THAT file
# (validated: its socket_path must match stord_socket above) instead of
# generating a minimal config — runtime_dir, backend_type,
# device_allowlist and [migration] then survive the respawn, and
# stord.db stays where the operator put it. Omitted (default) keeps the
# historical generated-config respawn; an unreadable/malformed file or
# a socket mismatch falls back to it with a loud warning. The agent
# user must be able to read the file (the standard install grants this
# via the chv-stord group).
stord_config_path = "/etc/chv/stord.toml"
