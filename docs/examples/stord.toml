# CHV Storage Daemon Configuration
# Place this file at /etc/chv/stord.toml

socket_path = "/run/chv/stord/api.sock"
runtime_dir = "/var/lib/chv/storage/localdisk"
log_level = "info"
path_allowlist = ["/var/lib/chv/storage/localdisk", "/var/lib/chv/storage/lvm"]
device_allowlist = ["/dev/dm-*", "/dev/mapper/*"]

# Storage migration (disk migration between stord peers).
#
# Migration is DISABLED by default: the daemon starts without credentials and
# migration actions fail as unavailable (never a plaintext fallback). With
# enabled = false, ANY field below being set is a startup error (fail-closed).
#
# Under enabled = true the two halves are INDEPENDENTLY OPTIONAL — configure
# the client half to send migrations, the receiver half to accept them, or
# both. Each half is all-or-nothing within itself (a partial half is a
# startup error), and enabled = true with NEITHER half configured is also a
# startup error (an enabled migration section that configures nothing is a
# misconfiguration).
#
# Client half (source: this stord initiates migrations to peers). All four
# fields are required TOGETHER; omitting all four under enabled = true makes
# this a destination-only stord that never initiates migrations:
#
# [migration]
# enabled = true
# client_cert_path = "/etc/chv/tls/stord-client.crt"   # node client certificate (PEM)
# client_key_path  = "/etc/chv/tls/stord-client.key"   # node private key (PEM)
# ca_cert_path     = "/etc/chv/tls/chv-ca.crt"         # CA bundle validating the destination
# dest_server_name = "stord-peer.internal"             # expected destination identity (DNS SAN)
#
# Destination-only stord (receiver only — no client identity to mint or
# maintain; outbound migration actions simply fail with a failed_precondition
# error):
#
# [migration]
# enabled = true
# listen_addr      = "0.0.0.0:50052"                   # receiver bind address
# server_cert_path = "/etc/chv/tls/stord-server.crt"   # receiver certificate (PEM)
# server_key_path  = "/etc/chv/tls/stord-server.key"   # receiver private key (PEM)
# client_ca_path   = "/etc/chv/tls/chv-ca.crt"         # CA authenticating migration peers
#
# File ownership/permissions: chv-stord runs as the 'chv' service user
# (see the packaged chv-stord.service), so cert and key should be owned by
# root:chv or chv:chv with 0640 (key) / 0644 (cert, CA). PEM material is
# never logged or returned in errors. Rotate keys by updating files and
# restarting the daemon — startup re-validates the pair.
#
# Migration receiver (server half, inbound migrations over mTLS):
# separate fields, all-or-nothing, and gated by enabled above — with ANY of
# them set while enabled = false the daemon REFUSES TO START (an operator
# who believes migration is off must not get an inbound TCP listener).
# With NONE of them set (and enabled = true) this stord is
# migration-source-only and never accepts inbound migrations. With ALL of
# them set, the material is validated at startup (fail-closed) and the TCP
# listener serves the migration receiver with MANDATORY
# client-certificate authentication — there is no plaintext listener and
# no client-auth-optional mode.
#
# listen_addr      = "127.0.0.1:50052"                  # receiver bind address
# server_cert_path = "/etc/chv/tls/stord-server.crt"    # receiver certificate (PEM)
# server_key_path  = "/etc/chv/tls/stord-server.key"    # receiver private key (PEM)
# client_ca_path   = "/etc/chv/tls/chv-ca.crt"          # CA authenticating migration peers
#
[migration]
enabled = false
