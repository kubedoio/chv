# CHV Web UI nginx configuration
#
# This configuration supports both single-node and multi-node deployments.
# It serves the SvelteKit SPA and proxies API / WebSocket traffic.
#
# ---------------------------------------------------------------------------
# WebSocket Console Routing — Deployment Modes
# ---------------------------------------------------------------------------
#
# Direct mode
#   The BFF returns a full ws:// or wss:// URL (e.g.
#   ws://192.168.1.10:8444/vms/{vm_id}/console?token=...).
#   The UI connects directly to the hypervisor node.  This works when the
#   browser can reach every node.  Each node must have its
#   agent_ws_address field set in the CHV database.
#
# Proxied mode (default when agent_ws_address is empty)
#   The BFF returns a relative path:
#     /ws/vms/{node_id}/{vm_id}/console?token=...
#   nginx strips the /ws/vms/{node_id} prefix and forwards the request to
#   the agent WebSocket server on the correct backend.  This is required
#   when nodes are on private networks or the UI sits behind a corporate
#   firewall and cannot reach individual nodes directly.
#
# ---------------------------------------------------------------------------
# Configuring node backends
# ---------------------------------------------------------------------------
#
# 1. Find the node_id for each compute node:
#      sqlite3 /var/lib/chv/controlplane.db "SELECT node_id, agent_ws_address FROM nodes;"
#
# 2. For each node, add a map entry below that points to the node's
#    agent console listen address (default port 8444).
#
# 3. Restart nginx:
#      sudo nginx -t && sudo systemctl restart nginx
#
# Example (uncomment and adapt):
#   map $request_uri $ws_backend {
#       default              127.0.0.1:8444;
#       ~^/ws/vms/node-1/   192.168.1.10:8444;
#       ~^/ws/vms/node-2/   192.168.1.11:8444;
#   }
#
# For very large clusters (hundreds of nodes) where static map entries
# become unwieldy, consider:
#   - OpenResty with lua-resty-upstream (dynamic upstream from DB)
#   - A dedicated WebSocket gateway (e.g. Traefik, Envoy) that can
#     route based on path or query parameters.
#
# ---------------------------------------------------------------------------
# Security note
# ---------------------------------------------------------------------------
#
# In production, terminate TLS in nginx and set the header
#   X-Forwarded-Proto: https
# so the BFF generates wss:// URLs for direct mode.  The proxied WS
# path is carried over the same nginx listener, so it automatically
# inherits whatever TLS/WSS termination you configure here.
#
# ---------------------------------------------------------------------------

map $request_uri $ws_backend {
    default 127.0.0.1:8444;
    # Add per-node backends here, e.g.:
    # ~^/ws/vms/node-1/ 192.168.1.10:8444;
    # ~^/ws/vms/node-2/ 192.168.1.11:8444;
}

server {
    listen 80;
    server_name _;

    root /opt/chv/ui;
    index index.html;

    # Static assets — fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so SPA updates are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Immutable hashed assets can be cached forever
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy legacy API calls to the control plane HTTP admin API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # Proxy BFF endpoints to the control plane HTTP listener
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # WebSocket proxy for serial console
    #
    # In proxied mode the BFF returns URLs such as:
    #   /ws/vms/{node_id}/{vm_id}/console?token=...
    # The regex below captures everything after the node_id, rewrites the
    # URI to /vms/{vm_id}/console?token=... (the path the agent expects),
    # and proxies to the backend selected by the $ws_backend map.
    location ~ ^/ws/vms/([^/]+)/(.*)$ {
        rewrite ^/ws/vms/[^/]+/(.*)$ /vms/$1 break;

        proxy_pass http://$ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: gzip for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
}
