apiVersion: chv.kubedo.io/v1alpha1
kind: CHVArchitecture

metadata:
  name: customer-a-production
  display_name: Customer A Production
  description: Production architecture for Customer A
  environment: production
  owner: senol@example.com
  labels:
    customer: customer-a
    criticality: high

servers:
  - name: chv-node-01
    management_ip: 10.10.0.11
    role: compute
    labels:
      zone: rack-a
      storage: nvme
    resources:
      cpu_cores: 32
      memory_gb: 256
    networks:
      interfaces:
        - name: eno1
          purpose: management
        - name: eno2
          purpose: vm_trunk

networks:
  - name: mgmt
    type: bridge
    bridge: chv-mgmt0
    cidr: 10.10.0.0/24
    gateway: 10.10.0.1
    dhcp:
      enabled: false

  - name: tenant-prod
    type: vlan
    bridge: chv-br0
    vlan_id: 120
    cidr: 10.120.0.0/24
    gateway: 10.120.0.1
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dhcp:
      enabled: true
      range_start: 10.120.0.100
      range_end: 10.120.0.200

datastores:
  - name: local-nvme
    type: qcow2-dir
    path: /var/lib/chv/datastores/local-nvme
    capabilities:
      snapshots: true
      thin_provisioning: true
      online_resize: true

backup_targets:
  - name: pbs-main
    type: proxmox-backup-server
    endpoint: https://pbs.example.com:8007
    datastore: chv-backups
    user: chv-backup@pbs
    secret_ref: pbs-main-token

backup_policies:
  - name: daily-retain-14
    target: pbs-main
    schedule: daily
    retention:
      daily: 14
      weekly: 4
      monthly: 3

images:
  - name: ubuntu-24.04
    source: local://images/ubuntu-24.04.qcow2
    format: qcow2
    datastore: local-nvme

ssh_keys:
  - name: senol-main-key
    public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA_example_replace_me

instance_users:
  - name: admin
    sudo: true
    shell: /bin/bash
    ssh_authorized_keys:
      - ref: senol-main-key

templates:
  - name: small-linux
    image: ubuntu-24.04
    cpu: 2
    memory_mb: 4096
    disk_gb: 40
    datastore: local-nvme
    network: tenant-prod

instances:
  - name: app-01
    template: small-linux
    placement:
      server: chv-node-01
    resources:
      cpu: 4
      memory_mb: 8192
    disks:
      - name: root
        size_gb: 60
        datastore: local-nvme
    networks:
      - name: tenant-prod
        ip: 10.120.0.21
      - name: mgmt
        ip: 10.10.0.21
    cloud_init:
      hostname: app-01
      users:
        - ref: admin
    backup:
      enabled: true
      policy: daily-retain-14
    tags:
      - app
      - production

roles:
  - name: platform-admin
    permissions:
      - "*"

  - name: project-operator
    permissions:
      - architecture:read
      - instance:read
      - instance:start
      - instance:stop
      - instance:restart
      - console:access

users:
  - name: senol
    display_name: Senol Colak
    email: senol@example.com
    auth:
      type: oidc
    roles:
      - platform-admin

  - name: operator-a
    display_name: Operator A
    email: operator@example.com
    auth:
      type: invite
    roles:
      - project-operator
