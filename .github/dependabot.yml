# Dependabot configuration for CHV.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Conventions:
# - Security updates and routine version bumps are grouped separately so that
#   security work can be reviewed and merged with a smaller blast radius.
# - PR limits keep review load bounded; raise per-ecosystem if backlog grows.
# - Reviewers are intentionally left commented-out; maintainers should fill in.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust workspace (root Cargo.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-maintainers"
    groups:
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      cargo-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Web UI (SvelteKit) — npm in /ui
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-frontend"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions used by workflows under .github/workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-admins"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      actions-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
