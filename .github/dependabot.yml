# Dependabot configuration for CHV.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Conventions:
# - Security updates and routine version bumps are grouped separately so that
#   security work can be reviewed and merged with a smaller blast radius.
# - PR limits keep review load bounded; raise per-ecosystem if backlog grows.
# - Reviewers are intentionally left commented-out; maintainers should fill in.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust workspace (root Cargo.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-maintainers"
    groups:
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      cargo-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Web UI (SvelteKit) — npm in /ui
  #
  # Toolchain-matrix note (#234): the UI's build toolchain is a coupled
  # matrix — @sveltejs/kit, vite, @sveltejs/vite-plugin-svelte, typescript,
  # @sveltejs/adapter-node, @sveltejs/adapter-static, and the Node engines
  # floor move together (peer/compat ranges are interlocking; a partial
  # update either fails to install or silently regresses the other half).
  # Major bumps for these packages must land as one coordinated PR
  # (see #234 for the kit-3 matrix move that set this precedent); the
  # parked majors in #488/#489/#490/#491 are superseded by that matrix.
  # The minor-and-patch groups below deliberately exclude majors, so
  # routine updates never fragment the matrix — no grouping change needed.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-frontend"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions used by workflows under .github/workflows
  # ---------------------------------------------------------------------------
  # Pin policy (production-readiness prompt 03, workstream F): every
  # third-party action is pinned to an immutable commit SHA with the moving
  # tag recorded in a trailing comment on the `uses:` line, e.g.
  #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  # Dependabot recognizes the comment's tag and proposes SHA updates as new
  # versions release — pinning does not lose updateability. New actions must
  # be pinned the same way; never add tag-pinned actions to security- or
  # release-critical workflows.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-admins"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      actions-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
