# Dependabot configuration for CHV.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Conventions:
# - Security updates and routine version bumps are grouped separately so that
#   security work can be reviewed and merged with a smaller blast radius.
# - PR limits keep review load bounded; raise per-ecosystem if backlog grows.
# - Reviewers are intentionally left commented-out; maintainers should fill in.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust workspace (root Cargo.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-maintainers"
    groups:
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      cargo-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Web UI (SvelteKit) — npm in /ui
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-frontend"
    # vitest major upgrades are deferred until after the v0.3.0 release
    # candidate window: the 3.x → 5.x jump is a breaking test-framework
    # migration (PR #309 failed CI) tracked in the upgrade issue. Minor and
    # patch updates, and any security update, still come through.
    ignore:
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions used by workflows under .github/workflows
  # ---------------------------------------------------------------------------
  # Pin policy (production-readiness prompt 03, workstream F): every
  # third-party action is pinned to an immutable commit SHA with the moving
  # tag recorded in a trailing comment on the `uses:` line, e.g.
  #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  # Dependabot recognizes the comment's tag and proposes SHA updates as new
  # versions release — pinning does not lose updateability. New actions must
  # be pinned the same way; never add tag-pinned actions to security- or
  # release-critical workflows.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    # reviewers:
    #   - "kubedoio/chv-admins"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      actions-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
