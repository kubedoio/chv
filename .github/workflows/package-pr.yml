name: PR Packages

# Build installable .deb and .rpm packages for every PR and branch push.
# Artifacts are uploaded for manual testing but never published.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build and Package
    # Pin to ubuntu-22.04 (glibc 2.35) so dynamically-linked binaries run on
    # the oldest distro in our smoke matrix (debian:12 ships glibc 2.36).
    # ubuntu-latest currently maps to ubuntu-24.04 (glibc 2.39); binaries
    # built there fail to load on debian:12 with "GLIBC_2.3X not found",
    # which the smoke test surfaces as a silent abort during --version checks.
    # See docs/release/release-implementation-checklist.md (CI matrix item).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned 2026-09-30)

      - name: Install protoc
        # Pinned to a recent protoc (>= 3.15) so proto3 optional fields work
        # without --experimental_allow_proto3_optional. Ubuntu 22.04's apt
        # package ships protoc 3.12, which predates that flag becoming
        # default. The arduino/setup-protoc action installs an official
        # protobuf release binary into the runner toolchain.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3 (pinned 2026-09-30)
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install packaging tools
        run: |
          sudo apt-get install -y gettext-base
          # Pin nfpm version for reproducible builds
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz" | tar -xz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (pinned 2026-09-30)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build release binaries and UI
        run: make build-release

      - name: Derive PR package version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            CHV_PKG_PRERELEASE="pr${PR_NUM}.${DATE}.g${SHA}"
            ARTIFACT_NAME="chv-packages-pr-${PR_NUM}"
          else
            RUN_NUM="${{ github.run_number }}"
            CHV_PKG_PRERELEASE="branch.${RUN_NUM}.${DATE}.g${SHA}"
            # Sanitize branch name for artifact naming
            SAFE_REF="${{ github.ref_name }}"
            SAFE_REF="${SAFE_REF//\//-}"
            SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
            ARTIFACT_NAME="chv-packages-branch-${SAFE_REF}-${RUN_NUM}"
          fi
          export CHV_PKG_PRERELEASE
          echo "pkg_version_deb=$(./scripts/version.sh --deb)" >> "$GITHUB_OUTPUT"
          echo "pkg_version_rpm=$(./scripts/version.sh --rpm)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "CHV_PKG_PRERELEASE=${CHV_PKG_PRERELEASE}" >> "$GITHUB_ENV"

      - name: Build packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

      - name: Check packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/check-package-files.sh
          ./scripts/package/check-safety.sh

      - name: Smoke test .deb packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-deb.sh dist/packages

      - name: Smoke test .rpm packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-rpm.sh dist/packages

      # #549: the converged WebUI serving shape — the tier-label gate for
      # the controlplane-served UI ([webui] enabled behind the packaged
      # proxy-only nginx edge, /ws/ console proxy to the agent).
      - name: Smoke test converged WebUI container
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-webui.sh dist/packages

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (pinned 2026-09-30)
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "## CHV PR Packages"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Debian version | ${{ steps.version.outputs.pkg_version_deb }} |"
            echo "| RPM version | ${{ steps.version.outputs.pkg_version_rpm }} |"
            echo "| Artifact | ${{ steps.version.outputs.artifact_name }} |"
            echo ""
            echo "### Built packages"
            echo ""
            echo "| Package | Size |"
            echo "|---------|------|"
            for f in dist/packages/*.deb dist/packages/*.rpm; do
              [ -e "$f" ] || continue
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | ${size} |"
            done
            echo ""
            echo "Download from the **Artifacts** section above."
            echo ""
            echo "### Install (Debian/Ubuntu)"
            echo '```bash'
            echo 'sudo dpkg -i chv-controlplane_*.deb chv-node_*.deb chvctl_*.deb'
            echo '```'
            echo ""
            echo "### Install (RHEL/CentOS/Fedora)"
            echo '```bash'
            echo 'sudo rpm -i chv-controlplane-*.rpm chv-node-*.rpm chvctl-*.rpm'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
