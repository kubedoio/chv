name: CI

# Version bumps are handled manually via:
#   make bump-version BUMP_TYPE=patch
# See scripts/bump-version.sh for details.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Validate VERSION format
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '$VERSION' does not match SemVer (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "VERSION=$VERSION is valid"

      - name: Validate crate versions match VERSION
        run: |
          VERSION=$(cat VERSION)
          MISMATCH=0
          for crate_toml in cmd/*/Cargo.toml; do
            CRATE_VERSION=$(grep '^version = ' "$crate_toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "$VERSION" != "$CRATE_VERSION" ]; then
              echo "VERSION file ($VERSION) does not match $crate_toml ($CRATE_VERSION)"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -eq 1 ]; then
            exit 1
          fi
          echo "All crate versions match VERSION"

      - name: Build chvctl
        run: cargo build --package chvctl

      - name: Smoke test chvctl version output
        run: |
          set -e
          VERSION=$(cat VERSION)
          OUTPUT=$(./target/debug/chvctl version)
          echo "chvctl version output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "$VERSION"; then
            echo "Expected version $VERSION in output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "commit"; then
            echo "Expected 'commit' in version output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "build"; then
            echo "Expected 'build' in version output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "channel"; then
            echo "Expected 'channel' in version output"
            exit 1
          fi

      - name: Run smoke-version.sh if present
        run: |
          if [ -x ./scripts/smoke-version.sh ]; then
            ./scripts/smoke-version.sh
          else
            echo "scripts/smoke-version.sh not found, skipping"
          fi

  ui:
    name: UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Build UI
        run: cd ui && npm run build

      - name: Run check (if exists)
        run: |
          cd ui
          if node -e "const pkg=require('./package.json'); if(pkg.scripts&&pkg.scripts.check){process.exit(0)}else{process.exit(1)}"; then
            npm run check
          else
            echo "check script not found in package.json, skipping"
          fi

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps

      - name: Build UI
        run: cd ui && npm run build

      - name: Start mock BFF server
        run: node ui/tests/e2e/mock-bff.mjs &
        env:
          MOCK_BFF_PORT: 8888

      - name: Run Playwright tests
        run: cd ui && npm run test:e2e
        env:
          BFF_BASE_URL: http://localhost:8888
