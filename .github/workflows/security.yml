name: Security

# Supply-chain security gates for the Rust workspace.
#
# - cargo audit  -> RustSec advisory database, raw Cargo.lock walk
#                   (no reachability filtering; reads .cargo/audit.toml)
# - cargo deny   -> licenses, banned crates, advisories, sources
#                   (feature-aware dependency graph; reads deny.toml)
#
# The two advisory checks have intentionally different semantics:
# cargo audit walks the raw lockfile and can surface advisories cargo-deny
# never evaluates (verified 2026-09-29 with an `unsound` advisory that was
# invisible to cargo-deny); cargo deny proves whether an affected crate is
# actually reachable in the build graph. Both must pass.
#
# Third-party actions are pinned to immutable commit SHAs with the version
# recorded in a trailing comment (updated by Dependabot's github-actions
# ecosystem — see .github/dependabot.yml). Do not add tag-pinned actions to
# security- or release-critical workflows. When updating manually, resolve
# the new tag's SHA, e.g.:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC — catches newly disclosed advisories on
    # already-merged code without needing a PR.
    - cron: "0 6 * * *"

permissions:
  contents: read
  # Required by rustsec/audit-check to file an issue if a vuln is found
  # on a scheduled run against the default branch.
  issues: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned 2026-09-29)

      # rustsec/audit-check runs `cargo audit` against Cargo.lock and reads
      # .cargo/audit.toml. It needs no cargo registry cache: cargo-audit
      # parses the lockfile directly without compiling the workspace.
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0 (pinned 2026-09-29)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Each check is run independently so a failure in one (e.g. a new
        # advisory) does not mask failures in another (e.g. a license change).
        check:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (pinned 2026-09-30)
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Run cargo deny (${{ matrix.check }})
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (pinned 2026-09-29)
        with:
          command: check ${{ matrix.check }}
          # deny.toml lives at the repo root.
          arguments: --all-features
