name: Nightly Packages

# Build, test, and publish nightly packages from every merge to main.
# Nightly packages are pre-release snapshots intended for development and
# integration testing. They are NOT production stable releases.
#
# Publishing modes:
#   - GitHub pre-release (default): attaches packages to a rolling 'nightly' release
#   - Package repository (optional): uploads to apt/yum repos if secrets are configured
#
# Trigger:
#   - push to main (after PR merge)
#   - manual workflow_dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode: build and test only, do not publish'
        required: false
        default: false
        type: boolean
      publish_target:
        description: 'Publishing target'
        required: true
        default: 'github'
        type: choice
        options:
          - github       # Create/update GitHub nightly pre-release
          - repo         # Upload to package repository (requires secrets)
          - both         # Publish to both GitHub and repository

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build and Package
    # Pin to ubuntu-22.04 (glibc 2.35) so dynamically-linked binaries run on
    # the oldest distro in our smoke matrix (debian:12 ships glibc 2.36).
    # ubuntu-latest currently maps to ubuntu-24.04 (glibc 2.39); binaries
    # built there fail to load on debian:12 with "GLIBC_2.3X not found",
    # which the smoke test surfaces as a silent abort during --version checks.
    # Same pin as package-pr.yml; without it this workflow has never been
    # green (every push-to-main run failed the debian:12 smoke).
    # See docs/release/release-implementation-checklist.md (CI matrix item).
    runs-on: ubuntu-22.04
    outputs:
      pkg_version_deb: ${{ steps.version.outputs.pkg_version_deb }}
      pkg_version_rpm: ${{ steps.version.outputs.pkg_version_rpm }}
      git_sha: ${{ steps.version.outputs.git_sha }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned 2026-09-30)

      - name: Install protoc
        # Pinned to a recent protoc (>= 3.15) so proto3 optional fields work
        # without --experimental_allow_proto3_optional. Ubuntu 22.04's apt
        # package ships protoc 3.12, which predates that flag becoming
        # default. The arduino/setup-protoc action installs an official
        # protobuf release binary into the runner toolchain.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3 (pinned 2026-09-30)
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install packaging tools
        run: |
          sudo apt-get install -y gettext-base
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz" | tar -xz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (pinned 2026-09-30)
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build release binaries and UI
        run: make build-release

      - name: Derive nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          CHV_PKG_PRERELEASE="nightly.${DATE}.g${SHA}"
          export CHV_PKG_PRERELEASE

          PKG_VERSION_DEB="$(./scripts/version.sh --deb)"
          PKG_VERSION_RPM="$(./scripts/version.sh --rpm)"

          echo "pkg_version_deb=${PKG_VERSION_DEB}" >> "$GITHUB_OUTPUT"
          echo "pkg_version_rpm=${PKG_VERSION_RPM}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "CHV_PKG_PRERELEASE=${CHV_PKG_PRERELEASE}" >> "$GITHUB_ENV"

          # Determine if we should publish (skip on dry-run)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run mode — packages will be built but not published"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

      - name: Check packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/check-package-files.sh
          ./scripts/package/check-safety.sh

      - name: Smoke test .deb packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-deb.sh dist/packages

      - name: Smoke test .rpm packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-rpm.sh dist/packages

      - name: Build old version packages for lifecycle test
        run: |
          export PACKAGE_VERSION="0.0.1"
          ./scripts/build-packages.sh --skip-build
          mkdir -p dist/packages-old
          cp dist/packages/* dist/packages-old/

      - name: Build new version packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

      - name: Lifecycle test .deb packages
        run: |
          ./scripts/package/lifecycle-deb.sh --new-packages dist/packages --old-packages dist/packages-old

      - name: Lifecycle test .rpm packages
        run: |
          ./scripts/package/lifecycle-rpm.sh --new-packages dist/packages --old-packages dist/packages-old

      - name: Generate SHA256 checksums
        run: |
          cd dist/packages
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (pinned 2026-09-30)
        with:
          name: nightly-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "## CHV Nightly Build"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Debian version | ${{ steps.version.outputs.pkg_version_deb }} |"
            echo "| RPM version | ${{ steps.version.outputs.pkg_version_rpm }} |"
            echo "| Git SHA | ${{ steps.version.outputs.git_sha }} |"
            echo "| Publish | ${{ steps.version.outputs.should_publish }} |"
            echo ""
            echo "### Built packages"
            echo ""
            echo "| Package | Size |"
            echo "|---------|------|"
            for f in dist/packages/*.deb dist/packages/*.rpm; do
              [ -e "$f" ] || continue
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | ${size} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publish to GitHub as a rolling nightly pre-release
  # ---------------------------------------------------------------------------
  publish-github:
    name: Publish GitHub Nightly Release
    runs-on: ubuntu-latest
    needs: build-and-package
    if: |
      needs.build-and-package.outputs.should_publish == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.publish_target == 'github' ||
       inputs.publish_target == 'both')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8 (pinned 2026-09-30)
        with:
          name: nightly-packages
          path: dist/packages/

      - name: Generate install notes
        run: |
          cat > /tmp/nightly-release-notes.md <<EOF
          ## CHV Nightly Build

          > ⚠️ **Warning:** Nightly packages are automatically built from the \`main\` branch.
          > They may contain unfinished features, regressions, or breaking changes.
          > Do not use in production.

          | Property | Value |
          |----------|-------|
          | Debian version | ${PKG_VERSION_DEB} |
          | RPM version | ${PKG_VERSION_RPM} |
          | Git SHA | ${GIT_SHA} |
          | Build date | $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC) |

          ### Install (Debian / Ubuntu)

          Download the \`.deb\` files below and install:

          \`\`\`bash
          sudo dpkg -i chv-controlplane_${PKG_VERSION_DEB}_amd64.deb
          sudo dpkg -i chv-node_${PKG_VERSION_DEB}_amd64.deb
          sudo dpkg -i chvctl_${PKG_VERSION_DEB}_amd64.deb
          \`\`\`

          ### Install (RHEL / CentOS / Fedora)

          Download the \`.rpm\` files below and install:

          \`\`\`bash
          sudo rpm -i chv-controlplane-${PKG_VERSION_RPM}-1.x86_64.rpm
          sudo rpm -i chv-node-${PKG_VERSION_RPM}-1.x86_64.rpm
          sudo rpm -i chvctl-${PKG_VERSION_RPM}-1.x86_64.rpm
          \`\`\`

          ### Package Repository (future)

          Once the nightly apt/yum repository is configured, you will be able to install with:

          \`\`\`bash
          # apt (future)
          # echo "deb [trusted=yes] https://repo.example.com/chv nightly main" | sudo tee /etc/apt/sources.list.d/chv-nightly.list
          # sudo apt update && sudo apt install chv-controlplane chv-node chvctl

          # yum (future)
          # sudo tee /etc/yum.repos.d/chv-nightly.repo <<REPO
          # [chv-nightly]
          # name=CHV Nightly
          # baseurl=https://repo.example.com/chv/nightly/rpm/\$basearch
          # enabled=1
          # gpgcheck=0
          # REPO
          # sudo dnf install chv-controlplane chv-node chvctl
          \`\`\`
          EOF
        env:
          PKG_VERSION_DEB: ${{ needs.build-and-package.outputs.pkg_version_deb }}
          PKG_VERSION_RPM: ${{ needs.build-and-package.outputs.pkg_version_rpm }}
          GIT_SHA: ${{ needs.build-and-package.outputs.git_sha }}

      - name: Prune old nightly release assets
        # The rolling 'nightly' release accumulates ~6 assets per push to main
        # and GitHub caps a release at 1000 assets — at the observed merge rate
        # (166 build-groups in 8 days when the cap was hit on 2026-10-05) the
        # cap is reached in about a week, after which every publish fails
        # (issue #508). Retention: keep the 14 most recent BUILD GROUPS, not
        # calendar nights — every asset of one run shares the
        # nightly.YYYYMMDD.g<sha> pre-release identifier in its filename, so
        # assets are grouped on that identifier, groups are ranked by their
        # newest asset's created_at, and everything outside the newest 14
        # groups is deleted — including undated stragglers (generic-named
        # per-run artifacts like SHA256SUMS or old-version packages), which
        # the upload below re-creates each run anyway. This step runs BEFORE
        # the upload, so the same run's assets are never pruned and a same-run
        # re-upload is unaffected. Fail-soft by decision: a prune hiccup warns
        # and the publish proceeds (retention housekeeping must not block
        # artifact publishing); the next run prunes again, and the summary
        # line plus any ::warning surface the result in the job log.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE_KEEP_GROUPS: '14'
        run: |
          set -euo pipefail

          keep_groups="${PRUNE_KEEP_GROUPS}"
          repo="${GITHUB_REPOSITORY}"
          tag="nightly"

          # Resolve the rolling release by tag. It may not exist yet (a fresh
          # repository — the upload step below creates it); then there is
          # nothing to prune.
          if ! release_id="$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.id')"; then
            echo "::warning::could not look up the '${tag}' release; skipping asset prune (the upload step below creates/updates the release)"
            exit 0
          fi

          # List every asset with id, name, and created_at (REST field name;
          # NOT createdAt). --paginate emits one JSON array per page;
          # 'jq -s add' merges the pages into a single list.
          assets_file="$(mktemp)"
          plan_file="$(mktemp)"
          trap 'rm -f "${assets_file}" "${plan_file}"' EXIT
          if ! gh api --paginate "repos/${repo}/releases/${release_id}/assets?per_page=100" > "${assets_file}"; then
            echo "::warning::could not list assets of the '${tag}' release; skipping asset prune"
            exit 0
          fi

          # Build the prune plan: the N build groups with the newest asset
          # timestamps are kept; every asset outside them, and every asset
          # whose name carries no nightly identifier (undated stragglers),
          # is deleted.
          if ! jq -s --argjson keep "${keep_groups}" '
            (add // [])
            | map({
                id: .id,
                name: .name,
                created_at: .created_at,
                group: ((.name | [scan("nightly\\.[0-9]{8}\\.g[0-9a-f]+")] | .[0]) // "")
              })
            | . as $assets
            | ([ $assets[] | select(.group != "") | .group ] | unique) as $groups
            | ([ $groups[] as $g
                 | { group: $g,
                     latest: ([$assets[] | select(.group == $g) | .created_at] | max) } ]
               | sort_by(.latest) | reverse
               | .[0:$keep]
               | map(.group)) as $keep
            | {
                assets: ($assets | length),
                groups: ($groups | length),
                keep: $keep,
                deletes: [ $assets[]
                           | select((.group == "") or (.group as $g | $keep | index($g) | not))
                           | [.id, .name] ]
              }
          ' "${assets_file}" > "${plan_file}"; then
            echo "::warning::could not compute the asset prune plan (unexpected API payload); skipping asset prune"
            exit 0
          fi

          # Guarded read-backs: a failure here must not abort the step
          # (set -e) and block the publish below — the fail-soft posture
          # applies to the counters too.
          if ! total_assets="$(jq -r '.assets' "${plan_file}")" \
            || ! total_groups="$(jq -r '.groups' "${plan_file}")" \
            || ! kept_count="$(jq -r '.keep | length' "${plan_file}")"; then
            echo "::warning::could not read the asset prune counters; skipping asset prune"
            exit 0
          fi

          # Delete everything the plan marks. Individual failures warn and
          # continue: a stuck asset must not block the publish below, and the
          # next run prunes it again.
          deleted=0
          failed=0
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "${asset_id}" ] || continue
            if gh api --method DELETE "repos/${repo}/releases/assets/${asset_id}"; then
              deleted=$((deleted + 1))
              echo "  pruned ${asset_name}"
            else
              failed=$((failed + 1))
              echo "::warning::failed to delete release asset ${asset_name} (id ${asset_id})"
            fi
          done < <(jq -r '.deletes[] | @tsv' "${plan_file}")

          echo "Nightly asset prune: ${total_groups} build group(s) found, kept the ${kept_count} newest (retention ${keep_groups}), pruned $((total_groups - kept_count)) group(s); assets: ${total_assets} before, ${deleted} deleted (per-asset DELETEs across the pruned groups and any strays), $((total_assets - deleted)) remaining; ${failed} delete failure(s)."
          if [ "${failed}" -gt 0 ]; then
            echo "::warning::${failed} release asset deletion(s) failed; continuing so publishing is not blocked (the next run prunes again)"
          fi

      - name: Update nightly GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (pinned 2026-09-30)
        with:
          tag_name: nightly
          name: CHV Nightly
          body_path: /tmp/nightly-release-notes.md
          prerelease: true
          files: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish to package repository (apt + yum)
  # ---------------------------------------------------------------------------
  publish-repo:
    name: Publish to Package Repository
    runs-on: ubuntu-latest
    needs: build-and-package
    environment: nightly-repo
    if: |
      needs.build-and-package.outputs.should_publish == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.publish_target == 'repo' || inputs.publish_target == 'both')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8 (pinned 2026-09-30)
        with:
          name: nightly-packages
          path: dist/packages/

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c curl gnupg

      - name: Generate and publish repository metadata
        run: |
          ./scripts/publish/publish-repo.sh \
            --packages dist/packages \
            --channel nightly \
            --version "${PKG_VERSION_DEB}"
        env:
          PKG_VERSION_DEB: ${{ needs.build-and-package.outputs.pkg_version_deb }}
          # Repository publishing secrets (all optional — script falls back to dry-run)
          CHV_REPO_URL: ${{ secrets.CHV_REPO_URL }}
          CHV_REPO_S3_BUCKET: ${{ secrets.CHV_REPO_S3_BUCKET }}
          CHV_REPO_S3_PREFIX: ${{ secrets.CHV_REPO_S3_PREFIX }}
          CHV_REPO_RSYNC_TARGET: ${{ secrets.CHV_REPO_RSYNC_TARGET }}
          CHV_REPO_GPG_KEY: ${{ secrets.CHV_REPO_GPG_KEY }}
          CHV_REPO_GPG_PASSPHRASE: ${{ secrets.CHV_REPO_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CHV_REPO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CHV_REPO_AWS_SECRET_ACCESS_KEY }}

      - name: Repository publish summary
        if: always()
        run: |
          {
            echo "## Package Repository Publish"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Channel | nightly |"
            echo "| Version | ${PKG_VERSION_DEB} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PKG_VERSION_DEB: ${{ needs.build-and-package.outputs.pkg_version_deb }}
