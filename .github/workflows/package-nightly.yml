name: Nightly Packages

# Build, test, and publish nightly packages from every merge to main.
# Nightly packages are pre-release snapshots intended for development and
# integration testing. They are NOT production stable releases.
#
# Publishing modes:
#   - GitHub pre-release (default): attaches packages to a rolling 'nightly' release
#   - Package repository (optional): uploads to apt/yum repos if secrets are configured
#
# Trigger:
#   - push to main (after PR merge)
#   - manual workflow_dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode: build and test only, do not publish'
        required: false
        default: false
        type: boolean
      publish_target:
        description: 'Publishing target'
        required: true
        default: 'github'
        type: choice
        options:
          - github       # Create/update GitHub nightly pre-release
          - repo         # Upload to package repository (requires secrets)
          - both         # Publish to both GitHub and repository

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    outputs:
      pkg_version_deb: ${{ steps.version.outputs.pkg_version_deb }}
      pkg_version_rpm: ${{ steps.version.outputs.pkg_version_rpm }}
      git_sha: ${{ steps.version.outputs.git_sha }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install packaging tools
        run: |
          sudo apt-get install -y gettext-base
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz" | tar -xz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build release binaries and UI
        run: make build-release

      - name: Derive nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          CHV_PKG_PRERELEASE="nightly.${DATE}.g${SHA}"
          export CHV_PKG_PRERELEASE

          PKG_VERSION_DEB="$(./scripts/version.sh --deb)"
          PKG_VERSION_RPM="$(./scripts/version.sh --rpm)"

          echo "pkg_version_deb=${PKG_VERSION_DEB}" >> "$GITHUB_OUTPUT"
          echo "pkg_version_rpm=${PKG_VERSION_RPM}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "CHV_PKG_PRERELEASE=${CHV_PKG_PRERELEASE}" >> "$GITHUB_ENV"

          # Determine if we should publish (skip on dry-run)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run mode — packages will be built but not published"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

      - name: Check packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/check-package-files.sh
          ./scripts/package/check-safety.sh

      - name: Smoke test .deb packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-deb.sh dist/packages

      - name: Smoke test .rpm packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-rpm.sh dist/packages

      - name: Build old version packages for lifecycle test
        run: |
          export PACKAGE_VERSION="0.0.1"
          ./scripts/build-packages.sh --skip-build
          mkdir -p dist/packages-old
          cp dist/packages/* dist/packages-old/

      - name: Build new version packages
        run: |
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

      - name: Lifecycle test .deb packages
        run: |
          ./scripts/package/lifecycle-deb.sh --new-packages dist/packages --old-packages dist/packages-old

      - name: Lifecycle test .rpm packages
        run: |
          ./scripts/package/lifecycle-rpm.sh --new-packages dist/packages --old-packages dist/packages-old

      - name: Generate SHA256 checksums
        run: |
          cd dist/packages
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nightly-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "## CHV Nightly Build"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Debian version | ${{ steps.version.outputs.pkg_version_deb }} |"
            echo "| RPM version | ${{ steps.version.outputs.pkg_version_rpm }} |"
            echo "| Git SHA | ${{ steps.version.outputs.git_sha }} |"
            echo "| Publish | ${{ steps.version.outputs.should_publish }} |"
            echo ""
            echo "### Built packages"
            echo ""
            echo "| Package | Size |"
            echo "|---------|------|"
            for f in dist/packages/*.deb dist/packages/*.rpm; do
              [ -e "$f" ] || continue
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | ${size} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publish to GitHub as a rolling nightly pre-release
  # ---------------------------------------------------------------------------
  publish-github:
    name: Publish GitHub Nightly Release
    runs-on: ubuntu-latest
    needs: build-and-package
    if: |
      needs.build-and-package.outputs.should_publish == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.publish_target == 'github' ||
       inputs.publish_target == 'both')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nightly-packages
          path: dist/packages/

      - name: Generate install notes
        run: |
          cat > /tmp/nightly-release-notes.md <<EOF
          ## CHV Nightly Build

          > ⚠️ **Warning:** Nightly packages are automatically built from the \`main\` branch.
          > They may contain unfinished features, regressions, or breaking changes.
          > Do not use in production.

          | Property | Value |
          |----------|-------|
          | Debian version | ${PKG_VERSION_DEB} |
          | RPM version | ${PKG_VERSION_RPM} |
          | Git SHA | ${GIT_SHA} |
          | Build date | $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC) |

          ### Install (Debian / Ubuntu)

          Download the \`.deb\` files below and install:

          \`\`\`bash
          sudo dpkg -i chv-controlplane_${PKG_VERSION_DEB}_amd64.deb
          sudo dpkg -i chv-node_${PKG_VERSION_DEB}_amd64.deb
          sudo dpkg -i chvctl_${PKG_VERSION_DEB}_amd64.deb
          \`\`\`

          ### Install (RHEL / CentOS / Fedora)

          Download the \`.rpm\` files below and install:

          \`\`\`bash
          sudo rpm -i chv-controlplane-${PKG_VERSION_RPM}-1.x86_64.rpm
          sudo rpm -i chv-node-${PKG_VERSION_RPM}-1.x86_64.rpm
          sudo rpm -i chvctl-${PKG_VERSION_RPM}-1.x86_64.rpm
          \`\`\`

          ### Package Repository (future)

          Once the nightly apt/yum repository is configured, you will be able to install with:

          \`\`\`bash
          # apt (future)
          # echo "deb [trusted=yes] https://repo.example.com/chv nightly main" | sudo tee /etc/apt/sources.list.d/chv-nightly.list
          # sudo apt update && sudo apt install chv-controlplane chv-node chvctl

          # yum (future)
          # sudo tee /etc/yum.repos.d/chv-nightly.repo <<REPO
          # [chv-nightly]
          # name=CHV Nightly
          # baseurl=https://repo.example.com/chv/nightly/rpm/\$basearch
          # enabled=1
          # gpgcheck=0
          # REPO
          # sudo dnf install chv-controlplane chv-node chvctl
          \`\`\`
          EOF
        env:
          PKG_VERSION_DEB: ${{ needs.build-and-package.outputs.pkg_version_deb }}
          PKG_VERSION_RPM: ${{ needs.build-and-package.outputs.pkg_version_rpm }}
          GIT_SHA: ${{ needs.build-and-package.outputs.git_sha }}

      - name: Update nightly GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: CHV Nightly
          body_path: /tmp/nightly-release-notes.md
          prerelease: true
          files: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish to package repository (apt + yum)
  # ---------------------------------------------------------------------------
  publish-repo:
    name: Publish to Package Repository
    runs-on: ubuntu-latest
    needs: build-and-package
    environment: nightly-repo
    if: |
      needs.build-and-package.outputs.should_publish == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.publish_target == 'repo' || inputs.publish_target == 'both')
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nightly-packages
          path: dist/packages/

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c curl gnupg

      - name: Generate and publish repository metadata
        run: |
          ./scripts/publish/publish-repo.sh \
            --packages dist/packages \
            --channel nightly \
            --version "${PKG_VERSION_DEB}"
        env:
          PKG_VERSION_DEB: ${{ needs.build-and-package.outputs.pkg_version_deb }}
          # Repository publishing secrets (all optional — script falls back to dry-run)
          CHV_REPO_URL: ${{ secrets.CHV_REPO_URL }}
          CHV_REPO_S3_BUCKET: ${{ secrets.CHV_REPO_S3_BUCKET }}
          CHV_REPO_S3_PREFIX: ${{ secrets.CHV_REPO_S3_PREFIX }}
          CHV_REPO_RSYNC_TARGET: ${{ secrets.CHV_REPO_RSYNC_TARGET }}
          CHV_REPO_GPG_KEY: ${{ secrets.CHV_REPO_GPG_KEY }}
          CHV_REPO_GPG_PASSPHRASE: ${{ secrets.CHV_REPO_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CHV_REPO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CHV_REPO_AWS_SECRET_ACCESS_KEY }}

      - name: Repository publish summary
        if: always()
        run: |
          {
            echo "## Package Repository Publish"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Channel | nightly |"
            echo "| Version | ${PKG_VERSION_DEB} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PKG_VERSION_DEB: ${{ needs.build-and-package.outputs.pkg_version_deb }}
