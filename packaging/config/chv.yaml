# CHV Unified Configuration Reference
# ===================================
# This file documents all CHV configuration options in one place.
# The packaged binaries read their own individual TOML files:
#   /etc/chv/controlplane.toml  — chv-controlplane
#   /etc/chv/agent.toml         — chv-agent
#   /etc/chv/stord.toml         — chv-stord
#   /etc/chv/nwd.toml           — chv-nwd
#
# Do not edit this file directly on a running system; it is a reference only.
# Edit the per-daemon TOML files under /etc/chv/ instead.

# ---------------------------------------------------------------------------
# Global Paths
# ---------------------------------------------------------------------------
node:
  data_dir: /var/lib/chv
  log_dir: /var/log/chv
  run_dir: /run/chv

# ---------------------------------------------------------------------------
# Control Plane
# ---------------------------------------------------------------------------
controlplane:
  grpc_bind: "127.0.0.1:8443"
  http_bind: "127.0.0.1:8080"
  log_level: info
  runtime_dir: /run/chv/controlplane
  agent_runtime_dir: /var/lib/chv/agent

  database:
    url: sqlite:///var/lib/chv/controlplane.db
    migrations_dir: /usr/share/chv/migrations
    max_connections: 4
    min_connections: 1
    acquire_timeout_secs: 5

  tls:
    ca_cert_path: /etc/chv/certs/ca.crt
    ca_key_path: /etc/chv/certs/ca.key
    server_cert_path: /etc/chv/certs/server.crt
    server_key_path: /etc/chv/certs/server.key
    client_ca_path: /etc/chv/certs/ca.crt

# ---------------------------------------------------------------------------
# Node Agent
# ---------------------------------------------------------------------------
agent:
  socket_path: /run/chv/agent/api.sock
  runtime_dir: /var/lib/chv/agent
  log_level: info
  control_plane_addr: https://127.0.0.1:8443
  stord_socket: /run/chv/stord/api.sock
  nwd_socket: /run/chv/nwd/api.sock
  chv_binary_path: /usr/bin/cloud-hypervisor
  stord_binary_path: /usr/bin/chv-stord
  nwd_binary_path: /usr/bin/chv-nwd
  cache_path: /var/lib/chv/cache/agent-cache.json
  authority_mode: legacy
  # Provisioned prerequisites; this does not enable Core production mode.
  core_store_path: /var/lib/chv/agent/core.db
  core_api_socket_path: /run/chv/core/core-v1.sock
  core_archive_path: /var/lib/chv/agent/node-cache-v1.archive
  node_id: ""                 # assigned automatically during enrollment
  metrics_bind: "127.0.0.1:9901"
  storage_base_dir: /var/lib/chv/storage

  bootstrap_token_path: /etc/chv/bootstrap.token

  tls_cert_path: /run/chv/agent/agent.crt
  tls_key_path: /run/chv/agent/agent.key
  ca_cert_path: /etc/chv/certs/ca.crt

# ---------------------------------------------------------------------------
# Storage Daemon
# ---------------------------------------------------------------------------
stord:
  socket_path: /run/chv/stord/api.sock
  runtime_dir: /var/lib/chv/storage/localdisk
  log_level: info
  path_allowlist:
    - /var/lib/chv/storage/localdisk
    - /var/lib/chv/storage/lvm
  device_allowlist:
    - /dev/dm-*
    - /dev/mapper/*

# ---------------------------------------------------------------------------
# Network Daemon
# ---------------------------------------------------------------------------
network:
  socket_path: /run/chv/nwd/api.sock
  runtime_dir: /run/chv/nwd
  log_level: info
  # Bridge topology is configured at runtime via gRPC from the control plane.
