# CHV Web UI — example reverse-proxy configuration for package-mode installs
#
# Tier: [CONTAINER-VERIFIED]. The #549 container package-smoke leg
# (scripts/package/smoke-webui.sh, wired into package-pr.yml, passed
# 2026-10-08) exercises this exact file as the edge of the converged
# serving shape. It remains an EXAMPLE for operators who installed CHV
# from the .deb/.rpm packages, and enables
# nothing by itself: the packages provide layout only (fail-closed
# contract, docs/DEPLOYMENT-ARCHITECTURE.md §4) and install no web
# server. The qualified deployment path is scripts/install.sh, which
# writes its own (same-shaped) nginx configuration.
#
# In the package this file is installed at:
#   /usr/share/chv/examples/chv-example.conf
# Operator documentation:
#   docs/DEPLOYMENT.md — "Serving the Web UI in package mode"
#
# Usage (Debian/Ubuntu; sites-enabled is included at http context, so
# the map below may live in this same file):
#   sudo cp chv-example.conf /etc/nginx/sites-available/chv
#   sudo ln -sf /etc/nginx/sites-available/chv /etc/nginx/sites-enabled/chv
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
# On RHEL-family systems, place the file in /etc/nginx/conf.d/ instead.
#
# D3 target (#447): the UI is served by the chv-controlplane binary
# itself, NOT by nginx. Enable it in /etc/chv/controlplane.toml first:
#
#   [webui]
#   enabled = true
#   # dir = "/usr/share/chv/ui"   (the package default)
#
# This file is a PROXY-ONLY edge: everything except the /ws/ serial
# console proxy is passed to the control plane's HTTP listener on
# 127.0.0.1:8080, which serves the static tree, the SPA fallback, and
# the cache headers (crates/chv-controlplane-service/src/api/router.rs)
# alongside the BFF/API routes. With [webui] disabled, this edge serves
# no UI at all (fail-closed). TLS termination at the edge is an
# operator concern (decision D7).

# WebSocket upgrade map, required by the /ws/ serial-console proxy
# below. install.sh writes the same map to
# /etc/nginx/conf.d/chv-websocket-map.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Everything (UI + BFF/API) from the control plane binary.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for the VM serial console. Required: in proxied
    # mode the BFF returns URLs such as
    #   /ws/vms/{node_id}/{vm_id}/console?token=...
    # which only work through an edge that proxies /ws/ — the control
    # plane binary does NOT proxy /ws/ (the #447 decision — documented,
    # not implemented; maintainer-ratified 2026-10-07). The node_id path
    # segment is stripped and the remainder is forwarded to the agent
    # console listener on 127.0.0.1:8444. Do not remove this location;
    # the serial console stops working without it.
    location ~ ^/ws/vms/[^/]+/(.*)$ {
        proxy_pass http://127.0.0.1:8444/vms/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
}
