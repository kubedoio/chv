# CHV Web UI — example reverse-proxy configuration for package-mode installs
#
# Tier: [CODE-SUPPORTED, UNQUALIFIED]. This file is an EXAMPLE for
# operators who installed CHV from the .deb/.rpm packages. It enables
# nothing by itself: the packages provide layout only (fail-closed
# contract, docs/DEPLOYMENT-ARCHITECTURE.md §4) and install no web
# server. The qualified deployment path is scripts/install.sh, which
# installs the UI under /opt/chv/ui and writes its own nginx
# configuration.
#
# In the package this file is installed at:
#   /usr/share/chv/examples/chv-example.conf
# Operator documentation:
#   docs/DEPLOYMENT.md — "Serving the Web UI in package mode"
#
# Usage (Debian/Ubuntu; sites-enabled is included at http context, so
# the map below may live in this same file):
#   sudo cp chv-example.conf /etc/nginx/sites-available/chv
#   sudo ln -sf /etc/nginx/sites-available/chv /etc/nginx/sites-enabled/chv
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
# On RHEL-family systems, place the file in /etc/nginx/conf.d/ instead.
#
# This file is a direct adaptation of the configuration written by
# scripts/install.sh (install_nginx, scripts/install.sh:1086-1141). The
# two copies can drift; convergence is tracked in the D3 target issue
# (#447). TLS termination at the edge is an operator concern (decision
# D7).

# WebSocket upgrade map, required by the /ws/ serial-console proxy
# below. install.sh writes the same map to
# /etc/nginx/conf.d/chv-websocket-map.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # The packaged UI tree. install.sh serves /opt/chv/ui instead.
    root /usr/share/chv/ui;
    index index.html;

    # Static files + SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so UI updates are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Immutable hashed assets can be cached for one year.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Legacy admin API on the control plane BFF (127.0.0.1:8080).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BFF /v1 surface on the control plane (127.0.0.1:8080).
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for the VM serial console. Required: in proxied
    # mode the BFF returns URLs such as
    #   /ws/vms/{node_id}/{vm_id}/console?token=...
    # which only work through an edge that proxies /ws/. The node_id
    # path segment is stripped and the remainder is forwarded to the
    # agent console listener on 127.0.0.1:8444. Do not remove this
    # location; the serial console stops working without it.
    location ~ ^/ws/vms/[^/]+/(.*)$ {
        proxy_pass http://127.0.0.1:8444/vms/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
}
