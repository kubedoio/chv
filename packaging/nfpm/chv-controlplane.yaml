name: chv-controlplane
arch: ${ARCH}
platform: linux
version: "${PACKAGE_VERSION}"
section: default
priority: optional
maintainer: Kubedo <engineering@kubedo.io>
description: CHV control plane service
homepage: https://github.com/kubedoio/chv
license: MIT
# Runtime libs: chv-controlplane links against OpenSSL 3 via reqwest's
# `native-tls` feature and rust-s3. The runtime soname is
# `libssl.so.3`, but the package name differs between distros —
# debian/ubuntu ship it as `libssl3`, RHEL ships it as `openssl-libs`.
# nfpm's per-format `overrides:` block sets the right name in the .deb
# vs .rpm without shipping a separate nfpm config per format.
overrides:
  deb:
    depends:
      - libssl3
  rpm:
    depends:
      - openssl-libs
contents:
  - src: target/release/chv-controlplane
    dst: /usr/bin/chv-controlplane
  - src: ui/build/
    dst: /usr/share/chv/ui
    type: tree
  # D3 interim: example reverse-proxy config for serving the packaged
  # UI tree. Documentation only — nothing in the package enables it.
  # Lives under /usr/share/chv (not /usr/share/doc): ubuntu images and
  # doc-minimized servers ship a dpkg path-exclude=/usr/share/doc/*
  # that silently drops files from that tree at install time.
  - src: packaging/nginx/chv-example.conf
    dst: /usr/share/chv/examples/chv-example.conf
  - src: cmd/chv-controlplane/migrations/
    dst: /usr/share/chv/migrations
    type: tree
  # Native monitoring store migrations (ADR-027, #602): the monitoring
  # database is disposable telemetry — packaged beside the operational
  # migrations but applied to a separate SQLite file with its own pool.
  - src: cmd/chv-controlplane/monitoring-migrations/
    dst: /usr/share/chv/monitoring-migrations
    type: tree
  - src: packaging/systemd/chv-controlplane.service
    dst: /lib/systemd/system/chv-controlplane.service
  - src: ${TMPDIR}/configs/controlplane.toml
    dst: /etc/chv/controlplane.toml
    type: config|noreplace
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
