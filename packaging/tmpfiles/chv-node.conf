# CellHV Core path prerequisites. Files, sockets, and the persistent runtime
# lease are owned by chv-agent and are never removed by tmpfiles.
d /run/chv/agent 0775 chv chv -
d /run/chv/core 0700 chv chv -
d /var/lib/chv/agent 0700 chv chv -
d /var/lib/chv/cache 0700 chv chv -
# chv-nwd.service lists /run/netns in ReadWritePaths (netns mount points for
# per-network namespaces). systemd requires ReadWritePaths entries to exist
# when it sets up the unit's mount namespace, and nothing else creates
# /run/netns on a clean system (iproute2 creates it on demand — too late for
# the unit start). Created here root:chv 0770 so the 'chv' service user can
# manage netns entries while the directory stays non-world-writable.
d /run/netns 0770 root chv -
