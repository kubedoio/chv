# Type Path Mode User Group Age Argument
# chv-monitor-agent (ADR-026): durable state is the agent's only
# writable surface — 0700 because it holds the client credential
# (certificate + private key) and the batch spool.
d /var/lib/chv-monitor 0700 chv-monitor chv-monitor -
d /var/lib/chv-monitor/spool 0700 chv-monitor chv-monitor -
