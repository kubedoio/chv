[package]
name = "chv-stord-core"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-common = { path = "../chv-common" }
chv-errors = { path = "../chv-errors" }
chv-observability = { path = "../chv-observability" }
chv-stord-api = { path = "../../gen/rust/chv-stord-api" }
chv-stord-backends = { path = "../chv-stord-backends" }
metrics = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
tokio-stream = { workspace = true }
rusqlite = { workspace = true }
crc32fast = { workspace = true }
sha2 = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }
uuid = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
# Loopback mTLS tests install the rustls ring crypto provider, exactly like
# `cmd/chv-stord` does at startup (required before any tonic/rustls TLS
# connection can be established).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
