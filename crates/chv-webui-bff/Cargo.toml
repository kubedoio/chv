[package]
name = "chv-webui-bff"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
tower = { workspace = true }
tower-http = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
chv-webui-bff-api = { path = "../../gen/rust/chv-webui-bff-api" }
chv-controlplane-store = { path = "../chv-controlplane-store" }
chv-monitoring-core = { path = "../chv-monitoring-core" }
chv-monitoring-store = { path = "../chv-monitoring-store" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
chv-architecture-reconcile = { path = "../chv-architecture-reconcile" }
# NetBox projection adapter (#239): the dry-run handler drives
# NetBoxClient/NetboxProjectionRunner directly (synchronous, bounded by
# the client's request timeout) and validates the custom-field prefix at
# config-upsert accept time.
chv-netbox-adapter = { path = "../chv-netbox-adapter" }
chv-common = { path = "../chv-common" }
# #379 DP3: the single frozen backend-class vocabulary
# (BACKEND_CLASSES / is_known_backend_class) used for accept-time
# validation of the VM-create payload's storage class — the same list
# PR 1's DEFAULT_BACKEND_CLASS lives next to, so the BFF never hardcodes
# a second copy.
chv-hypervisor-api = { path = "../chv-hypervisor-api" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls"] }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
chrono = "0.4"
metrics = { workspace = true }
tokio-util = { version = "0.7.18", features = ["io"] }
moka = { workspace = true }
# Notification test events carry a fresh uuid (PR-6).
uuid = { workspace = true }

[dev-dependencies]
chv-controlplane-store = { path = "../chv-controlplane-store", features = ["test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
# Self dev-dependency: turns this crate's `test-http` feature on for the
# integration-test build only (the standard Cargo pattern for exercising
# a feature-gated seam without enabling it in production builds).
chv-webui-bff = { path = ".", features = ["test-http"] }
# Mock NetBox for the dry-run wire tests (same version as
# chv-controlplane-service's wiremock suites).
wiremock = "0.6"

[features]
# Test-only passthrough of the adapter's plain-HTTP client constructor
# (see the `build_netbox_client` seam in handlers/netbox.rs), mirroring
# chv-controlplane-service's dev-only enablement of the adapter's
# `test-http` feature. NEVER enable this feature in production
# dependencies: the dry-run handler must stay on the HTTPS-only
# `NetBoxClient::new`.
test-http = ["chv-netbox-adapter/test-http"]
# Double-gated plain-HTTP demo path for the synchronous dry-run seam
# (ADR-024 decision 5, issue #586): default-off, forwarded from
# chv-controlplane-service's `netbox-demo` feature for the
# `make netbox-demo` harness. Unlike `test-http` above, this variant
# re-checks `CHV_NETBOX_ALLOW_HTTP=1` at runtime and fails closed
# without it, so the BFF's dry-run path carries the same double gate
# as the projection worker's demo factory. Release packaging builds
# default features only. Changes to this gate are high-risk (ADR-024
# consequences).
netbox-demo = ["chv-netbox-adapter/test-http"]
