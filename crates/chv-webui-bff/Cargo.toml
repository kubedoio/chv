[package]
name = "chv-webui-bff"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
tower = { workspace = true }
tower-http = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
chv-webui-bff-api = { path = "../../gen/rust/chv-webui-bff-api" }
chv-controlplane-store = { path = "../chv-controlplane-store" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
chv-common = { path = "../chv-common" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls"] }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
chrono = "0.4"
metrics = { workspace = true }
tokio-util = { version = "0.7.18", features = ["io"] }
moka = { workspace = true }

[dev-dependencies]
chv-controlplane-store = { path = "../chv-controlplane-store", features = ["test-util"] }
tempfile = { workspace = true }
