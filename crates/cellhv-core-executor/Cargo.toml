[package]
name = "cellhv-core-executor"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
async-trait = { workspace = true }
cellhv-core-operations = { path = "../cellhv-core-operations" }
cellhv-core-types = { path = "../cellhv-core-types" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
uuid = { workspace = true }

[dev-dependencies]
cellhv-core-store = { path = "../cellhv-core-store" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
