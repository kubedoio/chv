[package]
name = "chv-monitor-collectors"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Read-only /proc collectors for the chv guest monitoring agent (ADR-026 baseline + G4 families)"

[dependencies]
# statvfs(3) has no std API and the G4 filesystem family needs
