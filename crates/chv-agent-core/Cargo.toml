[package]
name = "chv-agent-core"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-common = { path = "../chv-common" }
chv-errors = { path = "../chv-errors" }
chv-observability = { path = "../chv-observability" }
chv-config = { path = "../chv-config" }
chv-hypervisor-api = { path = "../chv-hypervisor-api" }
cellhv-core-types = { path = "../cellhv-core-types" }
cellhv-core-operations = { path = "../cellhv-core-operations" }
cellhv-nodecache-migration = { path = "../cellhv-nodecache-migration" }
cellhv-core-fs = { path = "../cellhv-core-fs" }
cellhv-core-startup = { path = "../cellhv-core-startup" }
chv-stord-api = { path = "../../gen/rust/chv-stord-api" }
chv-nwd-api = { path = "../../gen/rust/chv-nwd-api" }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
tokio = { workspace = true }
tokio-util = "0.7"
tonic = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true, features = ["ws"] }
libc = "0.2"
futures-util = "0.3"
nix = { workspace = true, features = ["term", "ioctl", "process", "fs", "user"] }
jsonwebtoken = { workspace = true }
lru = "0.18"
sysinfo = "0.30"

[dev-dependencies]
chv-agent-runtime-ch = { path = "../chv-agent-runtime-ch" }
cellhv-core-api = { path = "../cellhv-core-api" }
http-body-util = "0.1"
tempfile = { workspace = true }
