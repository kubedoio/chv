[package]
name = "chv-agent-runtime-ch"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-common = { path = "../chv-common" }
chv-errors = { path = "../chv-errors" }
chv-observability = { path = "../chv-observability" }
cellhv-core-runtime-ownership = { path = "../cellhv-core-runtime-ownership" }
cellhv-core-types = { path = "../cellhv-core-types" }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }
nix = { version = "0.29", features = ["term", "fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
cellhv-core-executor = { version = "0.1.0", path = "../cellhv-core-executor" }
cellhv-core-operations = { version = "0.1.0", path = "../cellhv-core-operations" }

[dev-dependencies]
tempfile = { workspace = true }
metrics-util = "0.20"
