[package]
name = "chv-controlplane-service"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-controlplane-store = { path = "../chv-controlplane-store" }
chv-controlplane-seed = { path = "../chv-controlplane-seed" }
chv-hypervisor-api = { path = "../chv-hypervisor-api" }
chv-errors = { path = "../chv-errors" }
chv-webui-bff = { path = "../chv-webui-bff" }
chv-webui-bff-api = { path = "../../gen/rust/chv-webui-bff-api" }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
chv-common = { path = "../chv-common" }
chv-config = { path = "../chv-config" }
chv-observability = { path = "../chv-observability" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
chv-netbox-adapter = { path = "../chv-netbox-adapter" }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper-util = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt.workspace = true
chrono = "0.4"
cron = "0.17"
dashmap = { workspace = true }
metrics = { workspace = true }
futures = "0.3"
semver = "1"
toml = { workspace = true }
object_store = { workspace = true }
x509-parser = { version = "0.18", features = ["verify"] }

[features]
dev = []

[dev-dependencies]
tempfile = "3"
chv-controlplane-store = { path = "../chv-controlplane-store", features = ["test-util"] }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
# Enables the adapter's test-only plain-HTTP client constructor so the
# wiremock suites can exercise the real request path. Never enabled by
# the production dependency graph.
chv-netbox-adapter = { path = "../chv-netbox-adapter", features = ["test-http"] }
# In-process stateful NetBox simulator (ADR-024, lane 2) for the
# composed projection suite — dev-only exactly like the wiremock entry
# above; the simulator must never appear in a production dependency
# graph.
chv-netbox-sim = { path = "../chv-netbox-sim" }
wiremock = "0.6"
async-trait = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true }
tokio-stream = { workspace = true }
