[package]
name = "chv-controlplane-service"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-controlplane-store = { path = "../chv-controlplane-store" }
chv-controlplane-seed = { path = "../chv-controlplane-seed" }
chv-errors = { path = "../chv-errors" }
chv-webui-bff = { path = "../chv-webui-bff" }
chv-webui-bff-api = { path = "../../gen/rust/chv-webui-bff-api" }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
chv-common = { path = "../chv-common" }
chv-observability = { path = "../chv-observability" }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt.workspace = true
chrono = "0.4"
cron = "0.17"
dashmap = { workspace = true }
metrics = { workspace = true }
futures = "0.3"
semver = "1"
toml = { workspace = true }
hex = { workspace = true }
s3 = { workspace = true }
sha2 = { workspace = true }
x509-parser = "0.16"

[features]
dev = []

[dev-dependencies]
tempfile = "3"
chv-controlplane-store = { path = "../chv-controlplane-store", features = ["test-util"] }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
async-trait = { workspace = true }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true }
