[package]
name = "chv-controlplane-service"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-controlplane-store = { path = "../chv-controlplane-store" }
chv-controlplane-seed = { path = "../chv-controlplane-seed" }
chv-hypervisor-api = { path = "../chv-hypervisor-api" }
chv-errors = { path = "../chv-errors" }
chv-monitoring-core = { path = "../chv-monitoring-core" }
chv-monitoring-store = { path = "../chv-monitoring-store" }
chv-webui-bff = { path = "../chv-webui-bff" }
chv-webui-bff-api = { path = "../../gen/rust/chv-webui-bff-api" }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
chv-common = { path = "../chv-common" }
chv-config = { path = "../chv-config" }
chv-observability = { path = "../chv-observability" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
chv-netbox-adapter = { path = "../chv-netbox-adapter" }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper-util = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt.workspace = true
chrono = "0.4"
# HMAC-SHA256 webhook payload signing (notification dispatcher). 0.12
# matches the version already resolved in Cargo.lock via transitive
# users (jsonwebtoken/sqlx), and sha2 is pinned workspace-wide at 0.10
# for the same digest family.
hmac = "0.12"
sha2 = { workspace = true }
cron = "0.17"
dashmap = { workspace = true }
metrics = { workspace = true }
futures = "0.3"
semver = "1"
toml = { workspace = true }
object_store = { workspace = true }
x509-parser = { version = "0.18", features = ["verify"] }
uuid = { workspace = true }
# Notification dispatcher worker: hardened outbound HTTPS (HTTPS-only,
# no redirects, optional operator CA bundle). Same reqwest line as
# chv-netbox-adapter (rustls, JSON bodies); no multipart.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Backoff jitter for notification retries.
rand = { workspace = true }
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[features]
dev = []
# Double-gated plain-HTTP demo path (ADR-024 decision 5, issue #586):
# default-off, enables the adapter's test-only plain-HTTP client
# constructor for the `make netbox-demo` harness. The compile-time gate
# alone is NOT sufficient — the demo factory additionally requires
# `CHV_NETBOX_ALLOW_HTTP=1` at runtime and fails closed otherwise.
# The chv-webui-bff forwarding covers the BFF's synchronous dry-run
# seam with the same runtime-gated variant. Release packaging builds
# default features only, so this feature can never reach a shipped
# binary. Reviewers: changes to this gate are high-risk (see the
# ADR's consequences section).
netbox-demo = [
    "chv-netbox-adapter/test-http",
    "chv-webui-bff/netbox-demo",
]

[dev-dependencies]
tempfile = "3"
chv-controlplane-store = { path = "../chv-controlplane-store", features = ["test-util"] }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
# Enables the adapter's test-only plain-HTTP client constructor so the
# wiremock suites can exercise the real request path. Never enabled by
# the production dependency graph.
chv-netbox-adapter = { path = "../chv-netbox-adapter", features = ["test-http"] }
# In-process stateful NetBox simulator (ADR-024, lane 2) for the
# composed projection suite — dev-only exactly like the wiremock entry
# above; the simulator must never appear in a production dependency
# graph.
chv-netbox-sim = { path = "../chv-netbox-sim" }
wiremock = "0.6"
async-trait = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true }
tokio-stream = { workspace = true }
