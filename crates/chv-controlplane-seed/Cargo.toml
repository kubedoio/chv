[package]
name = "chv-controlplane-seed"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
chv-controlplane-store = { path = "../chv-controlplane-store" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
chv-architecture-validate = { path = "../chv-architecture-validate" }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros"] }
tracing = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
