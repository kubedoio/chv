[package]
name = "chv-stord"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "chv-stord"
path = "src/main.rs"

[dependencies]
chv-config = { path = "../../crates/chv-config" }
chv-observability = { path = "../../crates/chv-observability" }
chv-stord-core = { path = "../../crates/chv-stord-core" }
chv-stord-backends = { path = "../../crates/chv-stord-backends" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test material for the migration-wiring tests (self-signed cert/key pair);
# same version/features as `chv-stord-core`'s test-support usage.
rcgen = { version = "0.14", features = ["pem"] }
