[package]
name = "chv-controlplane"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "chv-controlplane"
path = "src/main.rs"

[features]
# Forwarded to the service crate so the operator contract in the
# `InsecureModeLockedOut` error message (#233 / PR #253) — "rebuild with:
# cargo build --features dev" — is actually satisfiable. Without this
# forwarding, `cargo build -p chv-controlplane --features dev` fails because
# the feature only existed on the dependency crate.
dev = ["chv-controlplane-service/dev"]
# Forwarded so `cargo build -p chv-controlplane --features netbox-demo`
# (the build step of `make netbox-demo`, issue #586 / ADR-024 decision 5)
# reaches the service crate's double-gated plain-HTTP demo module —
# same forwarding pattern as `dev` above. Default-off; release
# packaging builds default features only, so the plain-HTTP path can
# never reach a shipped binary. Runtime additionally requires
# CHV_NETBOX_ALLOW_HTTP=1 (the factory fails closed otherwise).
netbox-demo = ["chv-controlplane-service/netbox-demo"]

[dependencies]
chv-config = { path = "../../crates/chv-config" }
chv-controlplane-service = { path = "../../crates/chv-controlplane-service" }
chv-monitoring-store = { path = "../../crates/chv-monitoring-store" }
chv-controlplane-store = { path = "../../crates/chv-controlplane-store" }
chv-controlplane-seed = { path = "../../crates/chv-controlplane-seed" }
chv-webui-bff = { path = "../../crates/chv-webui-bff" }
chv-common = { path = "../../crates/chv-common" }
chv-observability = { path = "../../crates/chv-observability" }
sqlx = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
