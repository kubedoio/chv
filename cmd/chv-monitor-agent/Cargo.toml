[package]
name = "chv-monitor-agent"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "Optional in-guest monitoring agent (ADR-026): read-only /proc collectors, claim enrollment, mTLS ingestion, credential rotation"

[[bin]]
name = "chv-monitor-agent"
path = "src/main.rs"

[dependencies]
chv-monitor-collectors = { path = "../../crates/chv-monitor-collectors" }
chv-monitoring-core = { path = "../../crates/chv-monitoring-core" }
chv-observability = { path = "../../crates/chv-observability" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
# Plugin sandbox (security/plugins contract v1, "Execution limits"):
# kill(2) has no std API — the sandbox SIGKILLs the whole plugin
# process group on timeout/output overflow (descendant-kill
# guarantee), and tests gate the root-ownership acceptance path on
# geteuid(2). Same rationale as chv-monitor-collectors' libc dep.
libc = "0.2"
# Plugin sandbox: streamed SHA-256 verification of pinned plugin
# executables (security/plugins contract v1 — digest re-verified
# before every execution).
sha2 = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
# Same reqwest line as chv-netbox-adapter / chvctl (rustls, JSON bodies).
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
chv-agent-core = { path = "../../crates/chv-agent-core" }
chv-agent-runtime-ch = { path = "../../crates/chv-agent-runtime-ch" }
chv-controlplane-service = { path = "../../crates/chv-controlplane-service" }
chv-controlplane-store = { path = "../../crates/chv-controlplane-store", features = ["test-util"] }
chv-hypervisor-api = { path = "../../crates/chv-hypervisor-api" }
chv-monitoring-store = { path = "../../crates/chv-monitoring-store" }
axum = { workspace = true }
# Independent HMAC-SHA256 verification of the rig's webhook
# signatures (g4b evidence: the test must not reuse the signer's
# code). Same version line as chv-controlplane-service.
hmac = "0.12"
sqlx = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
