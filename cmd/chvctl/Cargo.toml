[package]
name = "chvctl"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "CLI for managing the CHV hypervisor platform"

[[bin]]
name = "chvctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
tabled = "0.21"
toml = "1.1"
