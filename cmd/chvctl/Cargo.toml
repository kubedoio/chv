[package]
name = "chvctl"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "CLI for managing the CHV hypervisor platform"

[[bin]]
name = "chvctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "7"

tabled = "0.22"
toml = "1.1"

[dev-dependencies]
tempfile = { workspace = true }
# #372 contract-test harness (tests/contract.rs): drives the real command
# path against a live BFF router. Dev-dependencies only — no production
# dependency direction changes (nothing in the workspace depends on
# chvctl, so there is no cycle). The list follows the #372 design §4
# Option B, plus two additions the design left to implementation:
# - chv-controlplane-service: admin_router(state, metrics) lives there
#   (it merges bff_router and mounts /admin/migrations/{id}/cancel, the
#   route the repointed `migrate cancel` row needs); the harness serves
#   admin_router, not bff_router, for exactly that reason.
# - chv-webui-bff-api: the MutationService response types the recording
#   stub must construct.
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
chv-common = { path = "../../crates/chv-common" }
chv-controlplane-store = { path = "../../crates/chv-controlplane-store" }
chv-controlplane-service = { path = "../../crates/chv-controlplane-service" }
chv-webui-bff = { path = "../../crates/chv-webui-bff" }
chv-webui-bff-api = { path = "../../gen/rust/chv-webui-bff-api" }

