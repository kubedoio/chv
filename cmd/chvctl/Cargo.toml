[package]
name = "chvctl"
version = "0.1.0"
edition = "2021"
description = "CLI for managing the CHV hypervisor platform"

[[bin]]
name = "chvctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
colored = "2"
tabled = "0.16"
toml = "0.8"
