[package]
name = "chv-agent"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "chv-agent"
path = "src/main.rs"

[dependencies]
cellhv-core-operations = { path = "../../crates/cellhv-core-operations" }
cellhv-core-executor = { path = "../../crates/cellhv-core-executor" }
chv-common = { path = "../../crates/chv-common" }
chv-config = { path = "../../crates/chv-config" }
chv-observability = { path = "../../crates/chv-observability" }
chv-agent-core = { path = "../../crates/chv-agent-core" }
chv-agent-runtime-ch = { path = "../../crates/chv-agent-runtime-ch" }
chv-errors = { path = "../../crates/chv-errors" }
cellhv-core-startup = { path = "../../crates/cellhv-core-startup" }
cellhv-core-runtime-owner = { path = "../../crates/cellhv-core-runtime-owner" }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
