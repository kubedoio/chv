[package]
name = "chv-agent"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "chv-agent"
path = "src/main.rs"

# Development-only insecure mode. When enabled, `CHV_ALLOW_INSECURE=1` may
# relax the enrolled-agent mTLS credential requirement (local development).
# Production builds (no `dev` feature) refuse the env var at startup with a
# typed error — mirroring `chv-controlplane-service`'s `validate_security_mode`
# (#233, PR #253; production-readiness prompt 03 workstream A).
[features]
dev = []

[dependencies]
chv-common = { path = "../../crates/chv-common" }
chv-config = { path = "../../crates/chv-config" }
chv-observability = { path = "../../crates/chv-observability" }
chv-agent-core = { path = "../../crates/chv-agent-core" }
chv-monitoring-core = { path = "../../crates/chv-monitoring-core" }
async-trait = { workspace = true }
chv-agent-runtime-ch = { path = "../../crates/chv-agent-runtime-ch" }
chv-hypervisor-api = { path = "../../crates/chv-hypervisor-api" }
chv-errors = { path = "../../crates/chv-errors" }
cellhv-core-startup = { path = "../../crates/cellhv-core-startup" }
cellhv-core-runtime-owner = { path = "../../crates/cellhv-core-runtime-owner" }
control-plane-node-api = { path = "../../gen/rust/control-plane-node-api" }
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
