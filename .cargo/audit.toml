# cargo-audit configuration for the CHV workspace.
#
# `cargo audit` (RustSec) walks Cargo.lock directly and is stricter than
# `cargo deny` — it does not perform feature/target reachability filtering,
# so it can surface advisories (e.g. `unsound`) that cargo-deny's graph walk
# never evaluates. Verified 2026-09-29: event-listener RUSTSEC-2026-0221
# (unsound) was invisible to cargo-deny but reported by cargo audit.
#
# Docs: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
# CI:   .github/workflows/security.yml (rustsec/audit-check@v2 reads this file)

[advisories]
# cargo-audit walks the raw Cargo.lock with NO reachability filtering, so its
# ignore set is NOT identical to deny.toml's: crates that are present in the
# lockfile but provably unreachable in the build graph (verified via
# `cargo deny list` / cargo-deny's feature-aware walk) still fire here and
# need an entry, with the reachability evidence documented below. Do not
# blindly mirror the two files — reconcile each against its own tool.
#
# Removed 2026-09-29 (prompt 03 reconciliation, issue #230):
#   RUSTSEC-2024-0370 (proc-macro-error 1.x) — crate left the graph entirely
#     when tabled moved off it; superseded state (proc-macro-error2) also gone.
ignore = [
    # RUSTSEC-2023-0071 — `rsa` Marvin Attack (no upstream patch).
    #   (a) Non-applicable: `rsa` enters Cargo.lock only via `sqlx-mysql`
    #       (sqlx 0.8 lists sqlx-mysql unconditionally in its top-level
    #       Cargo.toml). CHV enables only the `sqlite` feature, so none of
    #       that code is compiled into CHV binaries — cargo-deny's
    #       feature-aware graph walk confirms `rsa` is unreachable, which is
    #       why this advisory needs no ignore in deny.toml. cargo-audit has
    #       no reachability filtering, hence this entry.
    #   (b) Upstream: https://github.com/RustCrypto/RSA/issues/19 (no patch).
    #       sqlx side: https://github.com/launchbadge/sqlx/issues/2911
    #   (c) Remove when sqlx makes sqlx-mysql/-postgres optional, or `rsa`
    #       ships a constant-time implementation.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0134 — `rustls-pemfile` 2.x unmaintained.
    #   Since the tonic 0.12 -> 0.14 bump (#235 PR 1) the crate is a
    #   DIRECT dependency of chv-stord-core only (PEM parsing in
    #   src/server.rs + the migration mTLS tests) — tonic 0.14 no
    #   longer pulls it (upstream archived the repo and folded the
    #   parser into rustls-pki-types >= 1.9).
    #   Upstream:
    #     - https://github.com/rustls/pemfile/issues/61
    #     - https://github.com/hyperium/tonic/pull/2103
    #   Removal condition: #235 PR 2 migrates the three direct sites to
    #   rustls-pki-types::pem and drops the dependency.
    "RUSTSEC-2025-0134",

    # Removed 2026-10-01 (issue #177 resolved — rust-s3 replaced by
    # object_store 0.14): RUSTSEC-2026-0194 and RUSTSEC-2026-0195 no longer
    # require exceptions — quick-xml now resolves to 0.41.0, which is outside
    # both advisories' affected ranges.
]
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "none"

[database]
# NOTE: do NOT set `path` to a `~`-relative string — path expansion is
# tool-specific (cargo-audit expands it; cargo-deny does not and creates a
# literal `./~/` tree). The default (`~/.cargo/advisory-db`) is correct.
url  = "https://github.com/rustsec/advisory-db"
fetch = true
stale = false

[output]
deny = ["warnings", "unmaintained", "unsound", "yanked"]
format = "terminal"
quiet  = false

[yanked]
enabled = true
update_index = true
